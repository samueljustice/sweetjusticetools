<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sweet Justice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* The tools site: an internal downloads page. Plain and compact: the logo, a list of tools with their versions
   and download buttons, small print. Off-white, black ink, one red used sparingly; a system sans for reading,
   narrow caps for labels; hairline rules. */
:root {
  --paper: #f4f1ea; --ink: #16130f; --soft: #6a645a; --rule: #16130f; --hair: #cfc8ba; --red: #c8102e;
  --text: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --caps: "Archivo Narrow", "Arial Narrow", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 15px/1.5 var(--text); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
.wrap { width: 100%; max-width: 1040px; margin: 0 auto; padding: 0 clamp(18px, 4vw, 44px); }
.caps { font: 600 11px/1.3 var(--caps); letter-spacing: .12em; text-transform: uppercase; }

.strip { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 24px; padding: 9px 0 8px; border-bottom: 1px solid var(--rule); margin-top: 8px; }
.strip a { text-decoration: none; border-bottom: 1px solid currentColor; }
.strip a:hover { color: var(--red); }
.strip .soft { color: var(--soft); }

.head { display: flex; align-items: center; gap: 16px; margin: 22px 0 8px; }
.logo { display: block; width: 68px; height: auto; flex: none; color: var(--ink); }
h1 { font: 700 22px/1.1 var(--text); letter-spacing: -.01em; margin: 0; padding-left: 16px; border-left: 1px solid var(--hair); }
h1 small { display: block; font: 400 13px/1.4 var(--text); letter-spacing: 0; color: var(--soft); margin-top: 3px; }
.intro { margin: 0; max-width: 46em; color: var(--soft); }

.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 13px 8px; border: 1.5px solid var(--ink); border-radius: 0; background: var(--ink); color: var(--paper);
  font: 700 12px/1 var(--caps); letter-spacing: .12em; text-transform: uppercase; text-decoration: none; cursor: pointer; white-space: nowrap; transition: background .15s, color .15s, border-color .15s; }
.btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: square; }
.btn:hover { background: var(--red); border-color: var(--red); color: var(--paper); }
.btn:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }
.btn.plain { background: none; color: var(--ink); }
.btn.plain:hover { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.btn:disabled { opacity: .6; cursor: default; }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }

  main[hidden] { display: none; }
  form { margin: 18px 0 0; max-width: 420px; border-top: 1px solid var(--rule); padding-top: 18px; }
  form label.pw { display: block; margin: 0 0 8px; }
  .field { display: flex; }
  .field input { flex: 1; min-width: 0; padding: 11px 13px 10px; border: 1.5px solid var(--ink); border-right: 0; border-radius: 0; background: #fff; color: var(--ink); font: 400 16px/1.2 var(--text); outline: none; }
  .field input:focus-visible { box-shadow: inset 0 0 0 1.5px var(--ink); }
  label.keep { display: inline-flex; align-items: center; gap: 9px; margin: 14px 0 0; color: var(--soft); }
  label.keep input { accent-color: var(--ink); width: 15px; height: 15px; margin: 0; }
  .err { margin: 14px 0 0; color: var(--red); }
  .err[hidden] { display: none; }
  .note { margin: 18px 0 0; font-size: 13px; color: var(--soft); max-width: 28em; }
</style>
</head>

    return crypto.subtle.importKey('raw', b64(raw), 'AES-GCM', false, ['decrypt'])
      .then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: d.slice(0, 12) }, k, d.slice(12)); })
      .then(function (p) { return new TextDecoder().decode(p); });
  }
  function show(page) { document.open(); document.write(page); document.close(); }
  function ask() { document.getElementById('lock').hidden = false; document.getElementById('pw').focus(); }
  var err = document.getElementById('err');
  if (!window.crypto || !crypto.subtle) { ask(); err.textContent = 'This browser can\'t unlock the site. Try a current Safari, Chrome, Edge or Firefox.'; err.hidden = false; return; }
  var raw = stored();
  if (raw) unlock(raw).then(show).catch(function () { forget(); ask(); });
  else ask();
  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = document.getElementById('open'), label = document.getElementById('openlabel');
    btn.disabled = true; err.hidden = true; label.textContent = 'Opening…'; 
    crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('pw').value), 'PBKDF2', false, ['deriveBits'])
      .then(function (k) { return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: hex(SALT), iterations: ITER }, k, 256); })
      .then(function (bits) {
        var key = tob64(new Uint8Array(bits));
        return unlock(key).then(function (page) { keep(key, document.getElementById('remember').checked); show(page); });
      })
      .catch(function () { btn.disabled = false; label.textContent = 'Open'; err.hidden = false; document.getElementById('pw').select(); });
  });
})();
</script>
</body>
